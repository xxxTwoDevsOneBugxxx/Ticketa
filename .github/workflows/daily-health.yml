name: Daily Health Check

on:
  schedule:
    - cron: "0 16 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build

      - name: Update health report
        run: |
          echo "# Project Health" > health.md
          echo "" >> health.md
          echo "Last automated check: $(date -u '+%Y-%m-%d %H:%M UTC')" >> health.md
          echo "" >> health.md
          echo "## Status" >> health.md
          echo "" >> health.md
          echo "- Build: ✅ Passed" >> health.md
          echo "- Tests: ✅ Passed" >> health.md
          echo "- Updated automatically by GitHub Actions" >> health.md

      - name: Commit changes
        run: |
          git config user.name "moamenFathy"
          git config user.email "moamenmahmoud118@gmail.com"

          git add health.md

          git diff --cached --quiet || git commit -m "chore: update project health"

          git push